<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ASCII FPS – Procedural Voxel World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 10px 15px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 10;
            font-size: 12px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
        }
        .instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: #0f0;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            z-index: 20;
            font-size: 16px;
            border: 2px solid #0f0;
        }
    </style>
</head>
<body>
    <div id="info">ASCII VOXEL FPS</div>
    <div id="controls">WASD move | Mouse look | Click to start</div>
    <div class="instruction" id="clickPrompt">CLICK TO START</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Simple Perlin Noise
        class SimplexNoise {
            constructor(seed = 0) {
                this.p = [];
                for (let i = 0; i < 256; i++) this.p[i] = Math.floor(Math.random() * 256);
                // Shuffle
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.p[i], this.p[j]] = [this.p[j], this.p[i]];
                }
                this.p = this.p.concat(this.p);
            }

            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            grad(hash, x, y) {
                const h = hash & 15;
                const u = h < 8 ? x : y;
                const v = h < 8 ? y : x;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }

            noise(x, y) {
                const xi = Math.floor(x) & 255;
                const yi = Math.floor(y) & 255;
                const xf = x - Math.floor(x);
                const yf = y - Math.floor(y);
                const u = this.fade(xf);
                const v = this.fade(yf);

                const aa = this.p[this.p[xi] + yi];
                const ba = this.p[this.p[xi + 1] + yi];
                const ab = this.p[this.p[xi] + yi + 1];
                const bb = this.p[this.p[xi + 1] + yi + 1];

                const g1 = this.grad(aa, xf, yf);
                const g2 = this.grad(ba, xf - 1, yf);
                const g3 = this.grad(ab, xf, yf - 1);
                const g4 = this.grad(bb, xf - 1, yf - 1);

                const x1 = this.lerp(u, g1, g2);
                const x2 = this.lerp(u, g3, g4);
                return this.lerp(v, x1, x2);
            }
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 200, 400);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Sky
        const skyGeo = new THREE.SphereGeometry(400, 32, 32);
        const skyMat = new THREE.MeshBasicMaterial({ 
            color: 0x4a90e2,
            side: THREE.BackSide
        });
        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(100, 100, 100);
        light.castShadow = true;
        light.shadow.mapSize.width = 2048;
        light.shadow.mapSize.height = 2048;
        light.shadow.camera.left = -100;
        light.shadow.camera.right = 100;
        light.shadow.camera.top = 100;
        light.shadow.camera.bottom = -100;
        scene.add(light);

        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        // Terrain generation
        const noise = new SimplexNoise(42);
        const terrain = new THREE.Group();
        scene.add(terrain);

        const blockMaterial = new THREE.MeshStandardMaterial({
            roughness: 0.8,
            metalness: 0.1
        });

        // Generate visible terrain
        const terrainRadius = 40;
        const blocks = [];

        for (let x = -terrainRadius; x < terrainRadius; x += 4) {
            for (let z = -terrainRadius; z < terrainRadius; z += 4) {
                const height = Math.floor((noise.noise(x * 0.05, z * 0.05) + 1) * 10 + 5);
                
                for (let y = 0; y < height; y++) {
                    const color = y === height - 1 ? 0x2d8659 : (y > height - 3 ? 0x8b7355 : 0x654321);
                    const geo = new THREE.BoxGeometry(4, 4, 4);
                    const mat = new THREE.MeshStandardMaterial({ color });
                    const block = new THREE.Mesh(geo, mat);
                    block.position.set(x + 2, y * 4 + 2, z + 2);
                    block.castShadow = true;
                    block.receiveShadow = true;
                    terrain.add(block);
                    blocks.push({ mesh: block, x, y, z });
                }
            }
        }

        // Controls
        const keys = {};
        document.addEventListener('keydown', e => keys[e.key] = true);
        document.addEventListener('keyup', e => keys[e.key] = false);

        let yaw = 0, pitch = 0;
        let locked = false;
        let startTime = Date.now();

        function onMouseMove(e) {
            if (!locked) return;
            yaw -= e.movementX * 0.005;
            pitch -= e.movementY * 0.005;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
        }

        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            locked = document.pointerLockElement === renderer.domElement;
            if (locked) {
                document.getElementById('clickPrompt').style.display = 'none';
                document.addEventListener('mousemove', onMouseMove);
            } else {
                document.getElementById('clickPrompt').style.display = 'block';
                document.removeEventListener('mousemove', onMouseMove);
            }
        });

        let vel = 0;
        const moveSpeed = 0.3;
        const gravity = 0.01;

        function animate() {
            requestAnimationFrame(animate);

            // Update camera direction
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            if (locked) {
                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                let move = new THREE.Vector3();
                if (keys['w'] || keys['W']) move.addScaledVector(forward, moveSpeed);
                if (keys['s'] || keys['S']) move.addScaledVector(forward, -moveSpeed);
                if (keys['d'] || keys['D']) move.addScaledVector(right, moveSpeed);
                if (keys['a'] || keys['A']) move.addScaledVector(right, -moveSpeed);

                camera.position.add(move);

                // Gravity
                vel -= gravity;
                camera.position.y += vel;

                // Collision check - simple
                let collision = false;
                for (let block of blocks) {
                    const bx = block.x + 2;
                    const by = block.y * 4 + 2;
                    const bz = block.z + 2;
                    
                    const dx = Math.abs(camera.position.x - bx);
                    const dy = Math.abs(camera.position.y - by);
                    const dz = Math.abs(camera.position.z - bz);

                    if (dx < 3 && dy < 3 && dz < 3) {
                        collision = true;
                        break;
                    }
                }

                // Ground collision
                if (camera.position.y < 5) {
                    camera.position.y = 5;
                    vel = 0;
                    collision = true;
                }

                // Jump
                if ((keys[' '] || keys['w'] || keys['W']) && collision) {
                    vel = 0.4;
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>

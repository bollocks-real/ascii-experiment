<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ASCII FPS – Procedural Voxel World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 10px 15px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 10;
            font-size: 12px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
        }
        .instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: #0f0;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            z-index: 20;
            font-size: 16px;
            border: 2px solid #0f0;
        }
    </style>
</head>
<body>
    <div id="info">ASCII VOXEL FPS</div>
    <div id="controls">WASD move | Mouse look | Space jump | Click to start</div>
    <div class="instruction" id="clickPrompt">CLICK TO START</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Simple Perlin Noise
        class SimplexNoise {
            constructor(seed = 0) {
                this.p = [];
                for (let i = 0; i < 256; i++) this.p[i] = Math.floor(Math.random() * 256);
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.p[i], this.p[j]] = [this.p[j], this.p[i]];
                }
                this.p = this.p.concat(this.p);
            }

            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            grad(hash, x, y) {
                const h = hash & 15;
                const u = h < 8 ? x : y;
                const v = h < 8 ? y : x;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }

            noise(x, y) {
                const xi = Math.floor(x) & 255;
                const yi = Math.floor(y) & 255;
                const xf = x - Math.floor(x);
                const yf = y - Math.floor(y);
                const u = this.fade(xf);
                const v = this.fade(yf);

                const aa = this.p[this.p[xi] + yi];
                const ba = this.p[this.p[xi + 1] + yi];
                const ab = this.p[this.p[xi] + yi + 1];
                const bb = this.p[this.p[xi + 1] + yi + 1];

                const g1 = this.grad(aa, xf, yf);
                const g2 = this.grad(ba, xf - 1, yf);
                const g3 = this.grad(ab, xf, yf - 1);
                const g4 = this.grad(bb, xf - 1, yf - 1);

                const x1 = this.lerp(u, g1, g2);
                const x2 = this.lerp(u, g3, g4);
                return this.lerp(v, x1, x2);
            }
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4a90e2);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 100, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = false;
        renderer.sortObjects = false;
        document.body.appendChild(renderer.domElement);

        // Optimized sky with shader - gradient fixed to world, not camera
        const skyVertexShader = `
            varying vec3 vPos;
            void main() {
                vPos = position;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        
        const skyFragmentShader = `
            varying vec3 vPos;
            void main() {
                vec3 dir = normalize(vPos);
                float height = dir.y;
                height = height * 0.5 + 0.5;
                
                vec3 topColor = vec3(0.1, 0.2, 0.5);
                vec3 horizonColor = vec3(0.7, 0.8, 0.95);
                
                float t = smoothstep(0.0, 1.0, height);
                vec3 finalColor = mix(horizonColor, topColor, t);
                
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const skyMat = new THREE.ShaderMaterial({
            vertexShader: skyVertexShader,
            fragmentShader: skyFragmentShader,
            side: THREE.BackSide,
            depthWrite: false
        });

        const skyGeo = new THREE.SphereGeometry(400, 16, 16);
        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);

        // Simple lighting
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(100, 150, 100);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        // Terrain
        const noise = new SimplexNoise(42);
        const terrain = new THREE.Group();
        scene.add(terrain);

        const terrainRadius = 80;
        const blockSize = 4;
        const blocks = [];
        const blockMap = {};

        for (let x = -terrainRadius; x < terrainRadius; x += blockSize) {
            for (let z = -terrainRadius; z < terrainRadius; z += blockSize) {
                const height = Math.floor((noise.noise(x * 0.05, z * 0.05) + 1) * 10 + 5);
                
                for (let y = 0; y < height; y++) {
                    const key = `${x},${y},${z}`;
                    blockMap[key] = true;
                    
                    const color = y === height - 1 ? 0x2d8659 : (y > height - 4 ? 0x8b7355 : 0x654321);
                    const geo = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
                    const mat = new THREE.MeshStandardMaterial({ color });
                    const block = new THREE.Mesh(geo, mat);
                    
                    const px = x + blockSize / 2;
                    const py = y * blockSize + blockSize / 2;
                    const pz = z + blockSize / 2;
                    
                    block.position.set(px, py, pz);
                    terrain.add(block);
                    
                    blocks.push({
                        x: px,
                        y: py,
                        z: pz,
                        size: blockSize
                    });
                }
            }
        }

        // Controls
        const keys = {};
        document.addEventListener('keydown', e => keys[e.key] = true);
        document.addEventListener('keyup', e => keys[e.key] = false);

        let yaw = 0, pitch = 0;
        let locked = false;

        function onMouseMove(e) {
            if (!locked) return;
            yaw -= e.movementX * 0.005;
            pitch -= e.movementY * 0.005;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
        }

        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            locked = document.pointerLockElement === renderer.domElement;
            if (locked) {
                document.getElementById('clickPrompt').style.display = 'none';
                document.addEventListener('mousemove', onMouseMove);
            } else {
                document.getElementById('clickPrompt').style.display = 'block';
                document.removeEventListener('mousemove', onMouseMove);
            }
        });

        let vel = 0;
        const moveSpeed = 0.4;
        const gravity = 0.012;
        const playerRadius = 2;
        let isOnGround = false;
        let jumpCooldown = 0;

        function checkCollision(newX, newY, newZ) {
            for (let block of blocks) {
                const dx = Math.abs(newX - block.x);
                const dy = Math.abs(newY - block.y);
                const dz = Math.abs(newZ - block.z);
                const s = block.size / 2 + playerRadius;

                if (dx < s && dy < s && dz < s) {
                    return true;
                }
            }
            return false;
        }

        let lastUpdate = 0;
        function animate() {
            requestAnimationFrame(animate);

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            if (locked) {
                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                let moveX = 0, moveZ = 0;
                if (keys['w'] || keys['W']) { moveX += forward.x; moveZ += forward.z; }
                if (keys['s'] || keys['S']) { moveX -= forward.x; moveZ -= forward.z; }
                if (keys['d'] || keys['D']) { moveX += right.x; moveZ += right.z; }
                if (keys['a'] || keys['A']) { moveX -= right.x; moveZ -= right.z; }

                const moveLen = Math.sqrt(moveX * moveX + moveZ * moveZ);
                if (moveLen > 0) {
                    moveX = (moveX / moveLen) * moveSpeed;
                    moveZ = (moveZ / moveLen) * moveSpeed;
                }

                let newX = camera.position.x + moveX;
                let newZ = camera.position.z + moveZ;

                if (!checkCollision(newX, camera.position.y, newZ)) {
                    camera.position.x = newX;
                    camera.position.z = newZ;
                }

                vel -= gravity;
                let newY = camera.position.y + vel;

                isOnGround = false;
                if (checkCollision(camera.position.x, newY, camera.position.z)) {
                    let groundY = camera.position.y;
                    while (groundY > 0 && checkCollision(camera.position.x, groundY - 1, camera.position.z)) {
                        groundY -= 1;
                    }
                    camera.position.y = groundY;
                    vel = 0;
                    isOnGround = true;
                    jumpCooldown = 0;
                } else {
                    camera.position.y = newY;
                }

                jumpCooldown--;
                if ((keys[' '] || keys['w'] || keys['W']) && isOnGround && jumpCooldown < 0) {
                    vel = 0.25;
                    isOnGround = false;
                    jumpCooldown = 8;
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
